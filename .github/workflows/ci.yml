name: ci

# Work happens on long-lived feature branches (feature/embedded-go-mcp);
# CI runs on PRs to main and on release tags.
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # The sandboxctl go:embed glue and server binary are generated, not
      # committed; without them ./... does not compile.
      - name: go generate (fetch pin-verified server binary)
        run: go generate ./cmd/sandboxctl

      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test -short ./...

      # Integration: downloads the release bundle for this platform,
      # verifies the published sha256 pin, then runs the conformance
      # sequence the packaging repo's smoke-test.py defines
      # (initialize -> tools/list -> pull_provider github (null_auth)
      # -> list_services).
      - name: conformance tests
        run: go test -v -timeout 10m ./embed/

      - name: build sandboxctl (embeds the server binary)
        run: go build ./cmd/sandboxctl
