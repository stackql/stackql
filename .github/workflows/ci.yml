name: ci

# Drives CI on PR raise/update and on merge to main (the long-lived feature
# branch flow: open a PR from feature/* into main, CI gates the PR, merge runs
# the same checks on main).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore
        run: dotnet restore StackQL.Mcp.sln
      - name: dotnet format (verify no changes)
        run: dotnet format StackQL.Mcp.sln --verify-no-changes --no-restore

  build-test:
    name: build & test (${{ matrix.os }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Resolve StackQL bundle platform key
        id: platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  key="linux-x64" ;;
            windows-latest) key="windows-x64" ;;
            macos-latest)   key="darwin-universal" ;;
          esac
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Download StackQL bundle (activates conformance tests)
        id: bundle
        shell: bash
        env:
          STACKQL_VERSION: "0.10.500"
        run: |
          key="${{ steps.platform.outputs.key }}"
          asset="stackql-mcp-${key}.mcpb"
          url="https://github.com/stackql/stackql/releases/download/v${STACKQL_VERSION}/${asset}"
          dest="${RUNNER_TEMP}/${asset}"
          echo "Downloading $url"
          if curl -fsSL "$url" -o "$dest"; then
            echo "path=$dest" >> "$GITHUB_OUTPUT"
            echo "Downloaded bundle to $dest"
          else
            echo "Bundle download failed; conformance tests will skip."
          fi

      - name: Restore
        run: dotnet restore StackQL.Mcp.sln

      - name: Build
        run: dotnet build StackQL.Mcp.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test (unit + conformance against github null_auth)
        shell: bash
        env:
          STACKQL_MCP_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: dotnet test StackQL.Mcp.sln -c Release --no-build --verbosity normal

  pack:
    name: pack (validate NuGet output)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Pack (no publish)
        run: |
          dotnet pack src/StackQL.Mcp/StackQL.Mcp.csproj -c Release -o ./artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/StackQL.Mcp.AgentFramework/StackQL.Mcp.AgentFramework.csproj -c Release -o ./artifacts -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
