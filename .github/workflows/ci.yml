name: ci

# Work happens on the long-lived feature branch (feature/embedded-kotlin-mcp);
# CI runs on PRs to main and on release tags.
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests across every module (pins, args, platform, cache, bundle
      # extract, budget/engine/renderers, plugin functional tests). Hermetic:
      # no network, no credentials.
      - name: unit tests
        run: ./gradlew build --stacktrace

      # Conformance: the library downloads the release bundle for this
      # platform, verifies the published sha256 pin, spawns the embedded
      # server, and runs the sequence the packaging repo's smoke-test.py
      # defines (initialize -> tools/list -> pull_provider github (null_auth)
      # -> list_services), plus the read_only mutation-refusal check.
      - name: conformance tests (downloads + pin-verifies the server binary)
        run: ./gradlew :stackql-mcp:test -PrunIntegration=true --tests "io.stackql.mcp.ConformanceTest" --stacktrace

      # The costgate demo runs offline against the bundled rate card: prove the
      # CLI gates a build (exit 1 over budget) with no cloud credentials.
      - name: costgate demo (offline, gate must fail over budget)
        shell: bash
        run: |
          ./gradlew :costgate-cli:installDist --quiet
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=costgate-cli/build/install/costgate/bin/costgate.bat
          else
            BIN=costgate-cli/build/install/costgate/bin/costgate
          fi
          set +e
          "$BIN" check --intent examples/costgate.yaml --explain --junit-xml build/costgate.xml
          code=$?
          set -e
          echo "costgate exit code: $code"
          test "$code" -eq 1  # the example intent is deliberately over budget

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            build/costgate.xml
          if-no-files-found: ignore
