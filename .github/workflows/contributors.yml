name: contributors

# Regenerates internal/stackql/contributors/contributors.csv, the leaderboard
# behind SHOW CONTRIBUTORS (issue #320), using stackql itself: human
# contributors who have starred the repo, contributions descending. Opens a
# PR so every change to the credit list is reviewed. PRs opened with the
# workflow token do not trigger CI; close and reopen the PR to run it.

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CSV_PATH: internal/stackql/contributors/contributors.csv
  # Machine accounts operating as regular user accounts (PAT-driven CI
  # identities, AI coding agents with user accounts). GitHub Apps are
  # excluded generically by the type and [bot] filters in the query.
  DENYLIST: "'claude'"
  # An API failure or truncated result must not replace a healthy list.
  MIN_ROWS: 10

jobs:
  contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: stackql/setup-stackql@v2.3.1

      - name: Query contributors
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          stackql exec "REGISTRY PULL github;"
          stackql exec \
            --auth='{"github":{"type":"bearer","credentialsenvvar":"GITHUB_TOKEN"}}' \
            --http.response.pageLimit=-1 --http.response.maxResults=100 \
            --output csv \
            "SELECT c.login AS contributor, c.contributions
             FROM github.repos.contributors c
             INNER JOIN github.activity.repo_stargazers s ON s.login = c.login
             WHERE c.owner = 'stackql' AND c.repo = 'stackql'
             AND s.owner = 'stackql' AND s.repo = 'stackql'
             AND c.type = 'User'
             AND c.login NOT LIKE '%[bot]'
             AND c.login NOT IN (${DENYLIST})
             ORDER BY c.contributions DESC, c.login ASC" > "${CSV_PATH}"

      - name: Guard contributor count
        run: |
          count=$(tail -n +2 "${CSV_PATH}" | wc -l)
          if [ "${count}" -le "${MIN_ROWS}" ]; then
            echo "::error::contributor query returned ${count} rows (<= ${MIN_ROWS}), refusing to update ${CSV_PATH}"
            exit 1
          fi
          echo "${count} contributors"

      - name: Open PR on change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- "${CSV_PATH}"; then
            echo "leaderboard unchanged"
            exit 0
          fi
          branch="contributors/$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "${CSV_PATH}"
          git commit -m "contributors: refresh leaderboard"
          git push -u origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "contributors: refresh leaderboard" \
            --body "Regenerated by the contributors workflow. Human contributors who have starred the repo, contributions descending."
